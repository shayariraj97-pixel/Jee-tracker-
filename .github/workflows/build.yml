      - name: Register widget in manifest
        run: |
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          r = (
              '<receiver android:name=".JeeWidgetProvider" android:exported="true" android:label="JEE Pictures">'
              '<intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter>'
              '<meta-data android:name="android.appwidget.provider" android:resource="@xml/jee_widget_info" />'
              '</receiver>'
          )
          r2 = (
              '<receiver android:name=".QuoteCardProvider" android:exported="true" android:label="JEE Quote Card">'
              '<intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter>'
              '<meta-data android:name="android.appwidget.provider" android:resource="@xml/quote_card_info" />'
              '</receiver>'
          )
          assert "</application>" in s
          s = s.replace("</application>", r + r2 + "</application>", 1)
          open(p, "w", encoding="utf-8").write(s)
          PY

      - name: Create background pictures
        run: |
          pip install pillow
          mkdir -p android/app/src/main/res/drawable-nodpi
          cat > make_bg.py <<'EOF'
          from PIL import Image, ImageDraw, ImageFilter, ImageChops
          import random, os

          W, H = 1000, 500
          OUT = os.environ.get("OUT", "out")
          os.makedirs(OUT, exist_ok=True)
          random.seed(7)


          def lerp(a, b, t):
              return tuple(int(a[i] + (b[i] - a[i]) * t) for i in range(3))


          def vgrad(top, bot):
              im = Image.new("RGB", (W, H))
              d = ImageDraw.Draw(im)
              for y in range(H):
                  d.line([(0, y), (W, y)], fill=lerp(top, bot, y / (H - 1)))
              return im


          def glow(im, cx, cy, r, color):
              layer = Image.new("RGB", (W, H), (0, 0, 0))
              ImageDraw.Draw(layer).ellipse([cx - r, cy - r, cx + r, cy + r], fill=color)
              layer = layer.filter(ImageFilter.GaussianBlur(r / 2))
              return ImageChops.add(im, layer)


          def blobs(im, n, color, ymin, ymax, rmin, rmax, blur):
              layer = Image.new("RGB", (W, H), (0, 0, 0))
              d = ImageDraw.Draw(layer)
              for _ in range(n):
                  x = random.randint(0, W)
                  y = random.randint(ymin, ymax)
                  r = random.randint(rmin, rmax)
                  d.ellipse([x - r * 2, y - r, x + r * 2, y + r], fill=color)
              layer = layer.filter(ImageFilter.GaussianBlur(blur))
              return ImageChops.add(im, layer)


          def finish(im, name):
              im = im.filter(ImageFilter.GaussianBlur(0.7))
              sc = Image.new("RGBA", (W, H), (0, 0, 0, 0))
              d = ImageDraw.Draw(sc)
              for y in range(H):
                  t = max(0.0, (y - H * 0.28) / (H * 0.72))
                  d.line([(0, y), (W, y)], fill=(0, 0, 0, int(225 * t ** 1.1)))
              im = Image.alpha_composite(im.convert("RGBA"), sc).convert("RGB")
              im.save(os.path.join(OUT, "bg_%s.jpg" % name), quality=82)


          def samurai():
              im = vgrad((135, 140, 80), (232, 222, 185))
              im = glow(im, 820, 150, 150, (70, 60, 15))
              d = ImageDraw.Draw(im)
              d.polygon([(0, 330), (180, 260), (380, 330), (560, 280), (760, 340), (1000, 290), (1000, 500), (0, 500)], fill=(60, 75, 50))
              cx = 560
              d.polygon([(cx - 120, 215), (cx, 90), (cx + 120, 215)], fill=(205, 190, 155), outline=(120, 105, 80))
              d.ellipse([cx - 38, 205, cx + 38, 262], fill=(190, 140, 100))
              d.polygon([(cx - 80, 250), (cx + 80, 250), (cx + 145, 500), (cx - 145, 500)], fill=(25, 35, 30))
              d.line([(cx + 60, 110), (cx + 78, 500)], fill=(20, 20, 20), width=11)
              for y in range(300, 430, 26):
                  d.line([(cx + 66, y), (cx + 72, y + 10)], fill=(180, 40, 40), width=7)
              d.ellipse([140, 110, 270, 152], fill=(245, 245, 240))
              d.polygon([(150, 122), (50, 55), (115, 135)], fill=(240, 240, 235))
              d.polygon([(250, 125), (310, 80), (285, 138)], fill=(235, 235, 230))
              d.line([(255, 125), (310, 82)], fill=(235, 235, 230), width=7)
              d.line([(195, 150), (185, 215)], fill=(180, 150, 60), width=3)
              finish(im, "samurai")


          def waterfall():
              im = vgrad((40, 28, 22), (95, 70, 50))
              im = glow(im, 500, 200, 130, (110, 90, 70))
              d = ImageDraw.Draw(im)
              for _ in range(90):
                  x = random.randint(400, 600)
                  d.line([(x, 0), (x + random.randint(-6, 6), random.randint(250, 370))], fill=(235, 220, 195), width=random.randint(2, 6))
              d.rectangle([0, 360, W, H], fill=(38, 30, 28))
