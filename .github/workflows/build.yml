          cat > $JAVA/QuoteCardProvider.java <<'EOF'
          package com.jee.tracker;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.Context;
          import android.content.Intent;
          import android.view.View;
          import android.widget.RemoteViews;
          import java.util.Random;

          public class QuoteCardProvider extends AppWidgetProvider {

              static final String ACTION_NEXT = "com.jee.tracker.QUOTE_NEXT";

              @Override
              public void onUpdate(Context ctx, AppWidgetManager mgr, int[] ids) {
                  for (int id : ids) update(ctx, mgr, id);
              }

              @Override
              public void onReceive(Context ctx, Intent intent) {
                  if (ACTION_NEXT.equals(intent.getAction())) {
                      int id = intent.getIntExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, AppWidgetManager.INVALID_APPWIDGET_ID);
                      if (id != AppWidgetManager.INVALID_APPWIDGET_ID) {
                          RemoteViews rv = new RemoteViews(ctx.getPackageName(), R.layout.quote_card);
                          rv.showNext(R.id.flipper);
                          AppWidgetManager.getInstance(ctx).partiallyUpdateAppWidget(id, rv);
                      }
                      return;
                  }
                  super.onReceive(ctx, intent);
              }

              static void update(Context ctx, AppWidgetManager mgr, int id) {
                  String pkg = ctx.getPackageName();
                  RemoteViews rv = new RemoteViews(pkg, R.layout.quote_card);
                  rv.removeAllViews(R.id.flipper);
                  int n = Quotes.Q.length;
                  int[] copies = {R.id.qa1, R.id.qa2, R.id.qa3, R.id.qa4, R.id.qt};
                  for (int i = 0; i < n; i++) {
                      String[] q = Quotes.Q[i];
                      RemoteViews item = new RemoteViews(pkg, R.layout.quote_card_item);
                      for (int t : copies) item.setTextViewText(t, q[0]);
                      item.setTextViewText(R.id.qauthor, q[1]);
                      item.setViewVisibility(R.id.qauthor, q[1].length() == 0 ? View.GONE : View.VISIBLE);
                      int dots = ctx.getResources().getIdentifier("qc_dots_" + i, "drawable", pkg);
                      if (dots != 0) item.setImageViewResource(R.id.qdots, dots);
                      rv.addView(R.id.flipper, item);
                  }
                  rv.setDisplayedChild(R.id.flipper, new Random().nextInt(n));

                  Intent open = new Intent(ctx, MainActivity.class);
                  PendingIntent openPi = PendingIntent.getActivity(ctx, 0, open,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  rv.setOnClickPendingIntent(R.id.openApp, openPi);

                  Intent next = new Intent(ctx, QuoteCardProvider.class);
                  next.setAction(ACTION_NEXT);
                  next.putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, id);
                  PendingIntent nextPi = PendingIntent.getBroadcast(ctx, id, next,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  rv.setOnClickPendingIntent(android.R.id.background, nextPi);

                  mgr.updateAppWidget(id, rv);
              }
          }
          EOF

