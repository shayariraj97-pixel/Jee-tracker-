name: Build JEE Tracker APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Capacitor project
        run: |
          mkdir www
          cp index.html www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "JEE Tracker" com.jee.tracker --web-dir www
          npx cap add android

      - name: Add widget code
        run: |
          JAVA=android/app/src/main/java/com/jee/tracker
          RES=android/app/src/main/res
          mkdir -p $JAVA $RES/layout $RES/xml $RES/drawable

          cat > $JAVA/MainActivity.java <<'EOF'
          package com.jee.tracker;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(JeeWidgetPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

          cat > $JAVA/JeeWidgetPlugin.java <<'EOF'
          package com.jee.tracker;

          import android.content.Context;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "JeeWidget")
          public class JeeWidgetPlugin extends Plugin {
              @PluginMethod
              public void save(PluginCall call) {
                  String data = call.getString("data", "{}");
                  Context ctx = getContext();
                  ctx.getSharedPreferences("jee_widget", Context.MODE_PRIVATE)
                      .edit().putString("data", data).apply();
                  JeeWidgetProvider.refreshAll(ctx);
                  call.resolve();
              }
          }
          EOF

          cat > $JAVA/JeeWidgetProvider.java <<'EOF'
          package com.jee.tracker;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.view.View;
          import android.widget.RemoteViews;
          import java.util.Calendar;
          import java.util.Locale;
          import java.util.Random;
          import org.json.JSONObject;

          public class JeeWidgetProvider extends AppWidgetProvider {

              @Override
              public void onUpdate(Context ctx, AppWidgetManager mgr, int[] ids) {
                  for (int id : ids) update(ctx, mgr, id);
              }

              public static void refreshAll(Context ctx) {
                  AppWidgetManager mgr = AppWidgetManager.getInstance(ctx);
                  int[] ids = mgr.getAppWidgetIds(new ComponentName(ctx, JeeWidgetProvider.class));
                  for (int id : ids) update(ctx, mgr, id);
              }

              static void update(Context ctx, AppWidgetManager mgr, int id) {
                  Calendar ex = Calendar.getInstance();
                  ex.set(2028, Calendar.JANUARY, 24, 0, 0, 0);
                  long exam = ex.getTimeInMillis();
                  String dk = "";
                  int done = 0, streak = 0;

                  String raw = ctx.getSharedPreferences("jee_widget", Context.MODE_PRIVATE)
                      .getString("data", null);
                  if (raw != null) {
                      try {
                          JSONObject o = new JSONObject(raw);
                          exam = o.optLong("exam", exam);
                          dk = o.optString("today", "");
                          done = o.optInt("done", 0);
                          streak = o.optInt("streak", 0);
                      } catch (Exception e) { }
                  }

                  Calendar now = Calendar.getInstance();
                  String todayKey = String.format(Locale.US, "%04d-%02d-%02d",
                      now.get(Calendar.YEAR), now.get(Calendar.MONTH) + 1, now.get(Calendar.DAY_OF_MONTH));
                  if (!todayKey.equals(dk)) done = 0;
                  now.set(Calendar.HOUR_OF_DAY, 0);
                  now.set(Calendar.MINUTE, 0);
                  now.set(Calendar.SECOND, 0);
                  now.set(Calendar.MILLISECOND, 0);
                  long days = Math.round((exam - now.getTimeInMillis()) / 86400000.0);
                  if (days < 0) days = 0;

                  RemoteViews rv = new RemoteViews(ctx.getPackageName(), R.layout.jee_widget);

                  rv.removeAllViews(R.id.flipper);
                  for (String[] q : Quotes.Q) {
                      RemoteViews item = new RemoteViews(ctx.getPackageName(), R.layout.jee_quote_item);
                      item.setTextViewText(R.id.qtext, q[0]);
                      item.setViewVisibility(R.id.qtext, q[0].length() == 0 ? View.GONE : View.VISIBLE);
                      item.setTextViewText(R.id.qauthor, q[1]);
                      item.setViewVisibility(R.id.qauthor, q[1].length() == 0 ? View.GONE : View.VISIBLE);
                      int resId = ctx.getResources().getIdentifier("bg_" + q[2], "drawable", ctx.getPackageName());
                      if (resId != 0) item.setImageViewResource(R.id.qbg, resId);
                      rv.addView(R.id.flipper, item);
                  }
                  rv.setDisplayedChild(R.id.flipper, new Random().nextInt(Quotes.Q.length));

                  rv.setTextViewText(R.id.footer,
                      "\u23F3 " + days + " days left   \u2022   Today " + done + "/11   \u2022   \uD83D\uDD25 " + streak);


                  Intent open = new Intent(ctx, MainActivity.class);
                  PendingIntent pi = PendingIntent.getActivity(ctx, 0, open,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  rv.setOnClickPendingIntent(android.R.id.background, pi);

                  mgr.updateAppWidget(id, rv);
              }
          }
          EOF

