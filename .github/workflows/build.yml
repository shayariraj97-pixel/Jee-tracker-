      - name: Generate quotes from index.html
        run: |
          python3 - <<'PY'
          import re, json, html
          s = open("index.html", encoding="utf-8").read()
          m = re.search(r"var QD=\[(.*?)\];\s*var qi", s, re.S)
          items = re.findall(r'\["(\w+)","(.*?)","(.*?)"\]', m.group(1), re.S)
          assert len(items) > 0
          BY_TYPE = {"hero": "ember", "ravan": "fire", "bat": "shadow", "pain": "storm", "fog": "samurai",
                     "shiva": "night", "mono": "ember", "manga": "storm", "stoic": "sunset",
                     "prime": "ember", "ego": "storm", "paper": "mount"}
          KEYS = [("when to fight", "samurai"), ("responsible to everyone", "waterfall"),
                  ("fights monsters", "shadow"), ("darker the night", "night"),
                  ("why to live", "sunset"), ("hell is empty", "fire"), ("mind is stronger", "waterfall")]
          rows = []
          for t, q, a in items:
              if t == "ego":
                  continue
              q = re.sub(r"<br\s*/?>", "\n", q)
              q = q.replace("</div>", "\n")
              q = re.sub(r"<[^>]+>", "", q)
              q = html.unescape(q).strip()
              a = html.unescape(a).strip()
              if t.startswith("uonly_"):
                  scene = t.split("_", 1)[1]
              else:
                  scene = BY_TYPE.get(t, "storm")
                  for k, v in KEYS:
                      if k in q.lower():
                          scene = v
              rows.append("        {" + json.dumps(q) + ", " + json.dumps(a) + ", " + json.dumps(scene) + "}")
          java = "package com.jee.tracker;\n\npublic class Quotes {\n    public static final String[][] Q = {\n" + ",\n".join(rows) + "\n    };\n}\n"
          open("android/app/src/main/java/com/jee/tracker/Quotes.java", "w", encoding="utf-8").write(java)
          print("quotes:", len(rows))
          import os
          n = len(rows)
          os.makedirs("android/app/src/main/res/drawable", exist_ok=True)
          for k in range(n):
              paths = []
              for j in range(n):
                  cx = 7 + 14 * j
                  if j == k:
                      paths.append('<path android:fillColor="#111111" android:pathData="M%d,5 h10 a3,3 0 0 1 0,6 h-10 a3,3 0 0 1 0,-6 Z"/>' % (cx - 5))
                  else:
                      paths.append('<path android:fillColor="#C9C9C9" android:pathData="M%d,8 a3,3 0 1,0 6,0 a3,3 0 1,0 -6,0 Z"/>' % (cx - 3))
              xml = ('<?xml version="1.0" encoding="utf-8"?>\n<vector xmlns:android="http://schemas.android.com/apk/res/android"\n'
                     '    android:width="%ddp" android:height="8dp" android:viewportWidth="%d" android:viewportHeight="16">\n  %s\n</vector>\n'
                     % (n * 7, n * 14, "\n  ".join(paths)))
              open("android/app/src/main/res/drawable/qc_dots_%d.xml" % k, "w", encoding="utf-8").write(xml)
          PY

      - name: Use fixed signing key
        run: |
          if [ -f debug.keystore ]; then
            mkdir -p ~/.android
            cp debug.keystore ~/.android/debug.keystore
          fi

      - name: Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: JEE-Tracker-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --title "JEE Tracker build ${{ github.run_number }}" \
            --notes "Download app-debug.apk and install it."
